name: laundry
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.6.4

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # 🌐 تعريب عناصر Material (منتقي التاريخ · أزرار الحوارات · Tooltips).
  # **كانت غائبة** فكان `locale: Locale('ar')` في `main` بلا أثر، وكل عناصر
  # Material تعمل بالإنجليزية. تمرير `Locale('ar')` بلا هذه الحزمة في
  # `showDateRangePicker` كان **يُسقط التطبيق** (موثّق في
  # `customer_statement_sheet.dart`). إضافتها شرط لأي تبديل لغة سليم.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  # 🚫 حُذفت `window_manager_plus` (2026-11-07): كانت **غير مستخدمة إطلاقًا**
  # (صفر استخدام في `lib/`) لكنها تُسجَّل كإضافة أصلية على ويندوز وتثبّت
  # `WindowProc` delegate يُنفَّذ على **كل** رسالة نافذة — عبء دائم ومسار خطر
  # بلا أي فائدة. حذفها يُزيل `screen_retriever_windows` التابعة لها أيضًا.
  sqflite: ^2.4.2
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  # 🔀 محرّك قاعدة البيانات على **سطح المكتب** (ويندوز/Linux/macOS).
  # `sqflite` لا يعمل على ويندوز إطلاقًا، فهذه الحزمة تُوفّر نفس الواجهة عبر
  # sqlite3. على أندرويد يبقى `sqflite` الأصلي هو المستخدم ولا تُلمس هذه
  # الحزمة — التفاصيل والمفتاح في `lib/config/run_target.dart`.
  #
  # ⚠️ **لماذا 2.3.x وليس 2.4.x؟** لأن 2.4+ يعتمد `sqlite3` v3 الذي يبني
  # المكتبة عبر **build hooks**، وقد فشل فعليًا على ويندوز في هذا المشروع
  # (`Building native assets failed` عند `flutter build windows`). والتوثيق
  # الرسمي للحزمة يوصي بالرجوع إلى v2 عند هذه المشاكل حرفيًا:
  # «sqlite3 v3 depends on hooks which can cause some issues... you can simply
  #   add the following constraint to continue using sqlite3 v2».
  # فلا تُرقِّ إلى 2.4.x إلا بعد التأكد أن build hooks تعمل على جهازك.
  sqflite_common_ffi: ^2.3.7
  # يثبّت sqlite3 على الإصدار الثاني (مطلوب صراحةً مع sqflite_common_ffi 2.3.x).
  sqlite3: ^2.9.4
  # تُجمّع `sqlite3.dll` مع التطبيق على ويندوز (وفي Linux) في وضعي
  # التصحيح **والإصدار** معًا. بدونها يعمل التصحيح فقط، وتحتاج في نسخة
  # الإصدار إلى نسخ `sqlite3.dll` يدويًا بجانب الملف التنفيذي.
  sqlite3_flutter_libs: ^0.5.24
  font_awesome_flutter: ^10.8.0
  intl: ^0.20.2
  crypto: ^3.0.6
  path: ^1.9.0
  barcode: ^2.2.9
  file_picker: ^8.1.7
  package_info_plus: ^8.1.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.3"
  flutter_lints: ^5.0.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    # 🚨 إعلان مجلد **لا يشمل مجلداته الفرعية** في Flutter: `assets/fonts/`
    # وحدها لا تحزم `assets/fonts/Noto/…`. ولهذا تُذكر كل عائلة بسطرها —
    # وإلا اختفى الخطّ من الحزمة بلا أي خطأ وقت البناء، وفشل تحميله عند
    # العميل فقط. (اكتُشف: `TRAD.ttf` و`saudi_riyal.ttf` لم يُحزما رغم وجودهما.)
    - assets/fonts/Almarai/
    - assets/fonts/Amiri/
    - assets/fonts/Cairo/
    - assets/fonts/DTHULUTH/
    - assets/fonts/IBMPlex/
    - assets/fonts/Noto/
    - assets/fonts/Tajawal/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf

    - family: noto
      fonts:
        - asset: assets/fonts/Noto/AL-Mohanad.ttf
    
    - family: DTHULUTH
      fonts:
        - asset: assets/fonts/DTHULUTH/DTHULUTH-II-1.ttf

    # ─── خطوط الطباعة (اختيارية من الإعدادات) ───
    # كل عائلة هنا مرتبطة بخطّ في `lib/services/pdf/print_font.dart`،
    # فمعاينة الخطّ في الواجهة تظهر **بنفس الخطّ** الذي سيُطبع.
    # حرس `verify_print_font.dart` يتحقق من تطابق العائلات والمسارات.
    - family: notoSans
      fonts:
        - asset: assets/fonts/Noto/NotoSansArabic-Regular.ttf

    - family: notoNaskh
      fonts:
        - asset: assets/fonts/Noto/NotoNaskhArabic-Regular.ttf

    - family: notoKufi
      fonts:
        - asset: assets/fonts/Noto/NotoKufiArabic-Regular.ttf

    - family: ibmPlex
      fonts:
        - asset: assets/fonts/IBMPlex/IBMPlexSansArabic-Regular.ttf

    - family: ibmPlexLight
      fonts:
        - asset: assets/fonts/IBMPlex/IBMPlexSansArabic-Light.ttf

    - family: almarai
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Regular.ttf

    - family: almaraiLight
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Light.ttf

    - family: tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf

    - family: amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Regular.ttf
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
